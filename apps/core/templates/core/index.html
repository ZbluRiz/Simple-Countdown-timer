{% extends 'base.html' %}

{%  block content %}
    <div class="max-w-md rounded-lg shadow-lg p-8 w-full">
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label class="text-2xl font-bold text-gray-800 mb-6 text-center">Countdown Duration</label>
                {{ form.duration }}
            </div>
            <div class="form-group">
                <label class="text-2xl font-bold text-gray-800 mb-6 text-center">Countdown Interval</label>
                {{ form.interval }}
            </div>
            <div class="form-group">
                <label class="text-2xl font-bold text-gray-800 mb-6 text-center">Pop Up Message</label>
                {{ form.msg }}
            </div>
            <button class="mt-6 w-full bg-gray-500 hover:bg-gray-600 text-white font-semibold py-3 py-4 rounded-lg transition duration-200 active-scale-95">Result</button>
        </form>

    </div>
{% endblock %}
